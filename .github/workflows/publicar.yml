name: Publicar IngeArt

on:
  push:
    branches: [produccion]
    paths:
      - API_Ingear
      - Front_Ingear
      - .gitmodules
      - .github/workflows/publicar.yml
      - scripts/publicar_cloud.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicacion-ingear-produccion
  cancel-in-progress: false

env:
  VITE_DEPLOYMENT_TARGET: production
  VITE_API_BASE_URL: /api/v1
  VITE_AUTH_MODE: api
  VITE_TURNSTILE_SITE_KEY: ${{ vars.INGEAR_TURNSTILE_SITE_KEY }}
  VITE_TURNSTILE_DEV_BYPASS: "false"
  VITE_ENABLE_PWA_DEV: "false"

jobs:
  validar:
    if: github.ref == 'refs/heads/produccion'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      api: ${{ steps.versiones.outputs.api }}
      web: ${{ steps.versiones.outputs.web }}
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: ingear_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: ingear_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ingear_ci -d ingear_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: versiones
        name: Obtener las dos revisiones seleccionadas
        shell: bash
        env:
          INGEAR_SOURCE_READ_TOKEN: ${{ secrets.INGEAR_SOURCE_READ_TOKEN }}
        run: |
          if [[ -z "$INGEAR_SOURCE_READ_TOKEN" ]]; then
            echo "::error::Configura INGEAR_SOURCE_READ_TOKEN para leer los dos repositorios."
            exit 1
          fi
          api=$(git ls-tree HEAD -- API_Ingear | awk '$1 == "160000" && $2 == "commit" {print $3}')
          web=$(git ls-tree HEAD -- Front_Ingear | awk '$1 == "160000" && $2 == "commit" {print $3}')
          [[ "$api" =~ ^[0-9a-f]{40}$ && "$web" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::El commit principal debe apuntar a una revisión de la API y una del frontend."
            exit 1
          }
          printf 'api=%s\nweb=%s\n' "$api" "$web" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cripto26/Ingear_API
          ref: ${{ steps.versiones.outputs.api }}
          path: API_Ingear
          token: ${{ secrets.INGEAR_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cripto26/Front_Ingear
          ref: ${{ steps.versiones.outputs.web }}
          path: Front_Ingear
          token: ${{ secrets.INGEAR_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: API_Ingear/requirements-dev.txt
      - name: Probar API con PostgreSQL desechable
        working-directory: API_Ingear
        env:
          F15_TEST_DATABASE_URL: postgresql+psycopg://ingear_ci:disposable-ci-only@127.0.0.1:5432/ingear_ci
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libodbc2
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          .venv/bin/python scripts/quality_backend.py --disposable-database
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: Front_Ingear/.node-version
          cache: npm
          cache-dependency-path: Front_Ingear/package-lock.json
      - name: Probar y compilar el frontend de producción
        working-directory: Front_Ingear
        run: |
          npm ci
          npm run quality

  publicar:
    needs: validar
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      INGEAR_API_VERSION: ${{ needs.validar.outputs.api }}
      INGEAR_WIF_PROVIDER: ${{ vars.INGEAR_WIF_PROVIDER }}
      INGEAR_DEPLOY_SA: ingear-ci-deploy@stalwart-edge-513717-s4.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Comprobar configuración de conexión con Google Cloud
        shell: bash
        run: |
          if [[ -z "$INGEAR_WIF_PROVIDER" ]]; then
            echo "::error::Falta configurar la variable INGEAR_WIF_PROVIDER."
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cripto26/Ingear_API
          ref: ${{ needs.validar.outputs.api }}
          path: API_Ingear
          token: ${{ secrets.INGEAR_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cripto26/Front_Ingear
          ref: ${{ needs.validar.outputs.web }}
          path: Front_Ingear
          token: ${{ secrets.INGEAR_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: Front_Ingear/.node-version
          cache: npm
          cache-dependency-path: Front_Ingear/package-lock.json
      - name: Instalar las herramientas del frontend
        working-directory: Front_Ingear
        run: |
          npm ci
          version=$(node -p "require('./deployment-toolchain.json')['firebase-tools']")
          npm install --global --prefix "$RUNNER_TEMP/ingear-firebase" "firebase-tools@$version"
          printf '%s\n' "$RUNNER_TEMP/ingear-firebase/bin" >> "$GITHUB_PATH"
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "592.0.0"
      - id: auth_api
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.INGEAR_WIF_PROVIDER }}
          service_account: ${{ env.INGEAR_DEPLOY_SA }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false
      - id: api
        name: Construir, comprobar y activar la API
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth_api.outputs.access_token }}
        run: bash scripts/publicar_cloud.sh
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.INGEAR_WIF_PROVIDER }}
          service_account: ${{ env.INGEAR_DEPLOY_SA }}
      - name: Publicar frontend en Firebase Hosting
        working-directory: Front_Ingear
        env:
          F13_API_CHECK_ORIGIN: ${{ steps.api.outputs.origen }}
          F13_EXPECTED_API_VERSION: ${{ env.INGEAR_API_VERSION }}
          F13_EXPECTED_API_REVISION: ${{ steps.api.outputs.revision }}
        run: npm run deploy -- --project=stalwart-edge-513717-s4 --non-interactive
      - name: Comprobar la API desde Firebase Hosting
        working-directory: Front_Ingear
        timeout-minutes: 6
        env:
          F13_API_CHECK_ORIGIN: https://stalwart-edge-513717-s4.web.app
          F13_EXPECTED_API_VERSION: ${{ env.INGEAR_API_VERSION }}
          F13_EXPECTED_API_REVISION: ${{ steps.api.outputs.revision }}
        run: |
          intentos=12
          for ((intento=1; intento<=intentos; intento++)); do
            if npm run production:api; then
              printf 'Web publicada y comprobada: %s\n' "$F13_API_CHECK_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ((intento < intentos)); then
              printf 'Comprobación %d/%d fallida. Reintento en 10 segundos.\n' "$intento" "$intentos"
              sleep 10
            fi
          done
          echo '::error::La API de la revisión esperada no se verificó desde Firebase Hosting.'
          exit 1
